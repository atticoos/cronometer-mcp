name: Deploy previews

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine apps to deploy
        id: apps
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          WORKFLOW_PATH: .github/workflows/deploy-preview.yml
        run: |
          set -euo pipefail

          apps=()
          add() {
            local app="$1"
            local existing
            for existing in "${apps[@]-}"; do
              [[ "$existing" == "$app" ]] && return
            done
            apps+=("$app")
          }

          while IFS= read -r file; do
            case "$file" in
              apps/cronometer-mcp/*) add cronometer-mcp ;;
              apps/homepage/*) add homepage ;;
              package.json | package-lock.json | tsconfig.base.json | "$WORKFLOW_PATH")
                add cronometer-mcp
                add homepage
                ;;
            esac
          done < <(git diff --name-only "origin/$BASE_BRANCH"...HEAD)

          {
            if [[ ${#apps[@]} -eq 0 ]]; then
              echo "apps=[]"
            else
              printf 'apps=%s\n' "$(printf '%s\n' "${apps[@]}" | jq -R . | jq -sc .)"
            fi
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment:
      name: preview-${{ matrix.app }}
      url: ${{ steps.preview.outputs.deployment-url }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build homepage
        if: matrix.app == 'homepage'
        working-directory: apps/homepage
        run: npm run build
      - name: Deploy ${{ matrix.app }} preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Add preview URL to summary
        env:
          APP: ${{ matrix.app }}
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          echo "### ${APP}" >> "$GITHUB_STEP_SUMMARY"
          echo "${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
