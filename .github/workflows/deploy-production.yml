name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine apps to deploy
        id: apps
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_PATH: .github/workflows/deploy-production.yml
        run: |
          set -euo pipefail

          all_apps='["cronometer-mcp","homepage"]'

          if [[ "$EVENT_NAME" != push ]] \
            || [[ -z "$BEFORE_SHA" ]] \
            || [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]] \
            || ! git rev-parse -q --verify "$BEFORE_SHA^{commit}" > /dev/null; then
            echo "apps=$all_apps" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          apps=()
          add() {
            local app="$1"
            local existing
            for existing in "${apps[@]-}"; do
              [[ "$existing" == "$app" ]] && return
            done
            apps+=("$app")
          }

          while IFS= read -r file; do
            case "$file" in
              apps/cronometer-mcp/*) add cronometer-mcp ;;
              apps/homepage/*) add homepage ;;
              package.json | package-lock.json | tsconfig.base.json | "$WORKFLOW_PATH")
                add cronometer-mcp
                add homepage
                ;;
            esac
          done < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")

          {
            if [[ ${#apps[@]} -eq 0 ]]; then
              echo "apps=[]"
            else
              printf 'apps=%s\n' "$(printf '%s\n' "${apps[@]}" | jq -R . | jq -sc .)"
            fi
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: length(fromJSON(needs.changes.outputs.apps)) > 0
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment:
      name: production-${{ matrix.app }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build homepage
        if: matrix.app == 'homepage'
        working-directory: apps/homepage
        run: npm run build
      - name: Deploy ${{ matrix.app }}
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: deploy
