name: Deploy cronometer-mcp

on:
  push:
    branches: [main]
    paths:
      - "apps/cronometer-mcp/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-cronometer-mcp.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/cronometer-mcp/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-cronometer-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cronometer-mcp-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Deploy production
    runs-on: ubuntu-latest
    environment:
      name: production-cronometer-mcp
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/cronometer-mcp
          command: deploy

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Deploy preview
    runs-on: ubuntu-latest
    environment:
      name: preview-cronometer-mcp
      url: ${{ steps.preview.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/cronometer-mcp
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Add preview URL to summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          echo "### cronometer-mcp" >> "$GITHUB_STEP_SUMMARY"
          echo "${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
