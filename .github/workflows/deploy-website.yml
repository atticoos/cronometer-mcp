name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "apps/cronometer-mcp-website/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths:
      - "apps/cronometer-mcp-website/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-website-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview-homepage' || 'production-homepage' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      PAGES_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SITE_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.cronometer-homepage.pages.dev', github.event.pull_request.number) || '' }}
        run: npm run build --workspace cronometer-mcp-website
      - name: Verify static deployment
        working-directory: apps/cronometer-mcp-website
        run: |
          set -e
          test -f out/index.html
          test ! -e out/_worker.js
          test ! -e functions
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/cronometer-mcp-website
          command: pages deploy out --branch ${{ env.PAGES_BRANCH }}
      - name: Add deployment URL to summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Homepage" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
