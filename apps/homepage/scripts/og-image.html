<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #060a08;
        color: #d4d4d8;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 64px;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 75% 65% at 30% 0%, black, transparent);
        mask-image: radial-gradient(ellipse 75% 65% at 30% 0%, black, transparent);
      }
      .glow {
        position: absolute;
        top: -260px;
        left: 120px;
        width: 900px;
        height: 520px;
        background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.18), transparent 65%);
      }
      .row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wordmark {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 600;
        color: #fff;
      }
      .wordmark span {
        color: #34d399;
      }
      .badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        font-weight: 500;
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.25);
        background: rgba(16, 185, 129, 0.06);
        border-radius: 999px;
        padding: 8px 18px;
      }
      h1 {
        position: relative;
        font-size: 78px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.05;
        color: #fff;
        max-width: 950px;
      }
      h1 span {
        background: linear-gradient(90deg, #6ee7b7, #2dd4bf);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        position: relative;
        margin-top: 22px;
        font-size: 25px;
        line-height: 1.45;
        color: #a1a1aa;
        max-width: 860px;
      }
      .chips {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: "JetBrains Mono", monospace;
        font-size: 15.5px;
        font-weight: 500;
        border-radius: 10px;
        padding: 9px 15px;
        border: 1px solid;
      }
      .chip.read {
        color: #6ee7b7;
        border-color: rgba(16, 185, 129, 0.25);
        background: rgba(16, 185, 129, 0.06);
      }
      .chip.write {
        color: #fcd34d;
        border-color: rgba(245, 158, 11, 0.25);
        background: rgba(245, 158, 11, 0.06);
      }
      .chip .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: currentColor;
      }
      .endpoint {
        position: relative;
        margin-left: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="row">
      <div class="brand">
        <div class="logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <div class="wordmark">cronometer<span>-mcp</span></div>
      </div>
      <div class="badge">Unofficial · read &amp; write · MCP</div>
    </div>
    <div>
      <h1>Let AI <span>tailor your macros.</span></h1>
      <p class="sub">
        Turn what you logged and what remains into your next meal, custom foods, and a macro plan
        built around your goals.
      </p>
    </div>
    <div class="chips">
      <div class="chip read"><span class="dot"></span>get_macro_targets</div>
      <div class="chip read"><span class="dot"></span>get_food_log</div>
      <div class="chip read"><span class="dot"></span>get_daily_nutrition</div>
      <div class="chip write"><span class="dot"></span>add_custom_food</div>
      <div class="endpoint">GET /mcp · OAuth 2.1</div>
    </div>
  </body>
</html>
