      tags: [targets]
      operationId: getV3Targets
      summary: Per-nutrient target rows (v3 header auth; loaded after target edits)
      x-confidence: verified
      x-observed-at: 2026-08-27
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Target rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, description: "Nutrient id (negative ids are derived, e.g. -1205 net carbs)" }
                    min: { type: [number, "null"] }
                    max: { type: [number, "null"] }
                    vis: { type: boolean, description: "Visible on targets UI" }
                    custom: { type: boolean }

  /api/v3/user/{userId}/diary-entries:
    delete:
      tags: [diary]
      operationId: deleteDiaryEntries
      summary: Delete Serving and Exercise diary entries (v3 header auth)
      x-confidence: verified
      x-observed-at: 2026-08-27
      x-notes: >-
        Returns 204 on success. Entries of type Note or Biometric are
        REJECTED with 400 "Not able to deserialize data provided." — only
        Serving and Exercise shapes deserialize. Full objects returned by
        get_diary work for Serving/Exercise; minimal
        {type, <entryTypeId>, userId, day} shapes also work.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diaryEntries]
              properties:
                diaryEntries:
                  type: array
                  items: { $ref: "#/components/schemas/DiaryEntry" }
      responses:
        "204":
          description: Deleted
        "400":
          description: Unsupported entry types included

components:
  schemas:
    CallConfig:
      type: object
      properties:
        call_version: { type: integer, examples: [1, 2] }

    AuthBlock:
      type: object
      description: Embedded in every authenticated v2 body.
      required: [userId, token, api, os, build, flavour]
      properties:
        userId: { type: integer }
        token: { type: string, description: "session token from login" }
        api: { type: integer, examples: [3] }
        os: { type: string, examples: ["Android"] }
        build: { type: string, examples: ["2686"] }
        flavour: { type: string, examples: ["free", "gold"] }

    AuthBlockNullable:
      allOf:
        - $ref: "#/components/schemas/AuthBlock"
      description: Same shape but userId/token may be null (login).

    AuthOnlyBody:
      type: object
      required: [auth]
      properties:
        auth: { $ref: "#/components/schemas/AuthBlock" }
        lastSeen: { type: integer }
        config: { $ref: "#/components/schemas/CallConfig" }

    MessagesArray:
      type: array
      description: Server notification messages; observed fields id (int) and type (string, e.g. DATA_CHANGED)
      items:
        type: object
        properties:
          id: { type: integer }
          type: { type: string, examples: ["DATA_CHANGED"] }
        additionalProperties: true

    V2Date:
      type: string
      description: "Non-padded date: YYYY-M-D (e.g. 2026-8-26)"
      examples: ["2026-8-26"]

    DiaryEntry:
      type: object
      description: >-
        Union; discriminate on `type` (observed: Biometric, plus food serving,
        exercise, note variants not yet fully characterized).
      required: [type]
      properties:
        type: { type: string }
        amount: { type: number }
        day: { type: string }
        time: { type: string }
        userId: { type: integer }
        source: { type: string }
        externalId: { type: string }
        meta: { type: object, additionalProperties: true }
      additionalProperties: true

    ServingInput:
      type: object
      description: Request body of add_serving. Captured from food logging and water logging.
      required: [type, day, foodId, grams]
      properties:
        type: { type: string, examples: ["Serving"] }
        userId: { type: integer }
        day: { $ref: "#/components/schemas/V2Date" }
        time: { type: [string, "null"], description: "H:mm:ss when timestamp enabled" }
        foodId: { type: integer, description: "Water uses a synthetic food id (27536487 observed; grams = ml)" }
        grams: { type: number }
        measureId: { type: [integer, "null"] }
        translationId: { type: [integer, "null"] }
        servingId: { type: [integer, "null"] }
        offset: { type: [integer, "null"] }
        order: { type: integer, description: "(diaryGroup<<16)|n" }
        source: { type: [string, "null"] }

    FoodInput:
      type: object
      description: Request body of add_food (custom food or recipe). Captured 2026-08-27.
      required: [name, nutrients, measures]
      properties:
        id: { type: integer, description: "0 to create" }
        name: { type: string }
        category: { type: integer }
        owner: { type: [object, "null"] }
        retired: { type: [object, "null"] }
        source: { type: [string, "null"] }
        defaultMeasureId: { type: integer }
        comments: { type: [string, "null"] }
        alternateId: { type: [string, "null"] }
        labelType: { type: string, examples: ["AMERICAN_2016"] }
        measures:
          type: array
          description: "First entry is the user serving; app appends g (id 1) and oz (id 2) Weight measures"
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              value: { type: number, description: "Grams per unit" }
              amount: { type: number }
              type: { type: string, examples: ["Weight", "Atomic", "Recipe"] }
        nutrients:
          type: array
          description: "Macro rows use positive ids plus required negative mirrors (-203/-204/-205/-221); 208 energy kcal, 203 protein, 204 fat, 205 carbs, 291 fiber, 269 sugar, 307 sodium, 606 sat fat, -1205 net carbs"
          items:
            type: object
            properties:
              id: { type: integer }
              amount: { type: number }
        ingredients:
          type: array
          description: "Presence makes the food a recipe (client-side knowledge; not observed live this session)"
          items:
            type: object
            properties:
              foodId: { type: integer }
              grams: { type: number }
              measureId: { type: integer }
              translationId: { type: integer }
              id: { type: integer }
              value: { type: number }
        properties: { type: object, additionalProperties: { type: string } }
        foodTags: { type: array, items: { type: string } }
