  /api/v2/edit_target:
    post:
      tags: [targets]
      operationId: editTarget
      summary: Set one nutrient target (min/max range)
      x-confidence: verified
      x-observed-at: 2026-08-26
      x-notes: >-
        One call per nutrient. Negative id values observed for fixed macro
        targets (e.g. -1205). App follows with set_pref mirror writes and a
        get_diary refresh. Response is {"result":"SUCCESS","messages":[]}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, vis, cus, min, max, auth]
              properties:
                id: { type: integer, description: "Cronometer nutrient ID (negative = fixed macro targets)" }
                vis: { type: boolean }
                cus: { type: boolean, description: "custom target flag" }
                min: { type: number }
                max: { type: number }
                auth: { $ref: "#/components/schemas/AuthBlock" }
                lastSeen: { type: integer }
                config: { $ref: "#/components/schemas/CallConfig" }
      responses:
        "200":
          description: Success envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, examples: ["SUCCESS"] }
                  messages: { type: array, items: { type: string } }

  /api/v2/set_pref:
    post:
      tags: [targets]
