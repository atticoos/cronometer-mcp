# Cronometer Mobile API — OpenAPI 3.1
#
# Reverse-engineered from observed traffic of the official Android app
# (com.cronometer.android.gold, 4.44.3 b2686) via MITM capture.
# This is an UNDOCUMENTED, UNOFFICIAL API. Cronometer can change it at any
# time without notice. Field optionality is inferred from single samples.
#
# Convention:
#   x-confidence: verified   — request AND response captured live
#   x-confidence: inferred   — shape guessed from partial evidence
#   x-observed-at: date of capture
openapi: 3.1.0
info:
  title: Cronometer Mobile API
  version: 0.1.0
  description: |
    Private mobile API. All v2 POST bodies embed an auth block
    (except login/check_user, which establish it). Dates use the
    non-padded format `YYYY-M-D` in v2 bodies.
servers:
  - url: https://mobile.cronometer.com
tags:
  - name: auth
  - name: diary
  - name: foods
  - name: targets
  - name: misc

paths:
  /api/v2/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate and receive session token + full account/diary snapshot
      x-confidence: verified
      x-observed-at: 2026-08-26
      x-notes: >-
        No auth required. Response is very large (~100KB) and includes
        localization, profile, macro templates, and full diary entries.
        The session token for subsequent calls is returned in this body
        and echoed in every later auth block (also usable as the
        x-crono-session header for v3 GETs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, timezone, auth]
              properties:
                email: { type: string }
                password: { type: string }
                timezone: { type: string, examples: ["America/Toronto"] }
                userCode: { type: [string, "null"], description: "2FA code when prompted" }
                build: { type: string, examples: ["4.44.3 b2686-a"] }
                device: { type: string }
                firebaseToken: { type: [string, "null"] }
                features: { type: object }
                auth: { $ref: "#/components/schemas/AuthBlockNullable" }
                lastSeen: { type: integer }
                config:
                  type: object
                  properties:
                    call_version: { type: integer, examples: [2] }
      responses:
        "200":
          description: Session established; profile + diary snapshot
          content:
            application/json:
              schema:
                type: object
                description: Full snapshot; top-level keys observed include localization, logEverythingToCrashlytics, birthdate, gender, timezone, diaries. Session token is returned here.
                additionalProperties: true

  /api/v2/check_user:
    post:
      tags: [auth]
      operationId: checkUser
      summary: Check whether an email has an account (pre-login)
      x-confidence: verified
      x-observed-at: 2026-08-26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                lastSeen: { type: integer }
                config: { $ref: "#/components/schemas/CallConfig" }
      responses:
        "200":
          description: Account existence info
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /api/v2/get_diary:
    post:
      tags: [diary]
      operationId: getDiary
      summary: Full diary for one day (servings, biometrics, exercises, notes, summary)
      x-confidence: verified
      x-observed-at: 2026-08-26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day, auth]
              properties:
                day: { $ref: "#/components/schemas/V2Date" }
                auth: { $ref: "#/components/schemas/AuthBlock" }
                lastSeen: { type: integer }
                config: { $ref: "#/components/schemas/CallConfig" }
      responses:
        "200":
          description: Diary document
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    description: consumed/macros/burned/targets_percent/highlighted_targets as seen in login response diaries[].summary
                    additionalProperties: true
                  template: { type: object, additionalProperties: true }
                  diary:
                    type: array
                    description: Mixed entry list — food servings, biometrics, exercises, notes. Discriminate on `type`.
                    items: { $ref: "#/components/schemas/DiaryEntry" }
                additionalProperties: true

  /api/v2/get_report:
    post:
      tags: [diary]
      operationId: getReport
      summary: Nutrition report over a date range
      x-confidence: verified
      x-observed-at: 2026-08-26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end, type, auth]
              properties:
                start: { $ref: "#/components/schemas/V2Date" }
                end: { $ref: "#/components/schemas/V2Date" }
                type: { type: string, examples: ["All"] }
                supplements: { type: boolean }
                allTime: { type: boolean }
                auth: { $ref: "#/components/schemas/AuthBlock" }
                lastSeen: { type: integer }
                config: { $ref: "#/components/schemas/CallConfig" }
      responses:
        "200":
          description: Report data
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /api/v2/get_food:
    post:
