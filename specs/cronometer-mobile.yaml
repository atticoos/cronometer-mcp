      responses:
        "200":
          description: Success envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, examples: ["SUCCESS"] }
                  messages: { type: array, items: { type: string } }

  /api/v2/add_braze_event_db:
