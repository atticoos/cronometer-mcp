components:
  schemas:
    CallConfig:
      type: object
      properties:
        call_version: { type: integer, examples: [1, 2] }

    AuthBlock:
      type: object
      description: Embedded in every authenticated v2 body.
      required: [userId, token, api, os, build, flavour]
      properties:
        userId: { type: integer }
        token: { type: string, description: "session token from login" }
        api: { type: integer, examples: [3] }
        os: { type: string, examples: ["Android"] }
        build: { type: string, examples: ["2686"] }
        flavour: { type: string, examples: ["free", "gold"] }

    AuthBlockNullable:
      allOf:
        - $ref: "#/components/schemas/AuthBlock"
      description: Same shape but userId/token may be null (login).

    AuthOnlyBody:
      type: object
      required: [auth]
      properties:
        auth: { $ref: "#/components/schemas/AuthBlock" }
        lastSeen: { type: integer }
        config: { $ref: "#/components/schemas/CallConfig" }

    MessagesArray:
      type: array
      description: Server notification messages; observed fields id (int) and type (string, e.g. DATA_CHANGED)
      items:
        type: object
        properties:
          id: { type: integer }
          type: { type: string, examples: ["DATA_CHANGED"] }
        additionalProperties: true

    V2Date:
      type: string
      description: "Non-padded date: YYYY-M-D (e.g. 2026-8-26)"
      examples: ["2026-8-26"]

    DiaryEntry:
      type: object
      description: >-
        Union; discriminate on `type` (observed: Biometric, plus food serving,
        exercise, note variants not yet fully characterized).
      required: [type]
      properties:
        type: { type: string }
        amount: { type: number }
        day: { type: string }
        time: { type: string }
        userId: { type: integer }
        source: { type: string }
        externalId: { type: string }
        meta: { type: object, additionalProperties: true }
      additionalProperties: true
