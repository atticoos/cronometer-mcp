  /photoupload:
    post:
      tags: [diary]
      operationId: photoupload
      summary: Create/edit diary Note entries and upload diary photos (multipart, ROOT path — not under /api)
      x-confidence: verified
      x-observed-at: 2026-08-27
      x-notes: >-
        multipart/form-data with fields: action ("diaryImage" observed),
        sessionKey (auth by session, no auth block), noteId (0 = create),
        day (YYYY-M-D), order (diary slot), deleteExistingPhoto, noteText.
        The photo file part was not exercised. Server adds a User-Agent
        "Dart/3.8 (dart:io)" style request; the response is the stored
        Note entry.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [action, sessionKey, noteId, day, order]
              properties:
                action: { type: string, examples: ["diaryImage"] }
                sessionKey: { type: string }
                noteId: { type: integer, description: "0 to create" }
                day: { type: string, examples: ["2026-8-27"] }
                order: { type: integer }
                deleteExistingPhoto: { type: boolean }
                noteText: { type: string }
      responses:
        "200":
          description: Stored Note entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  noteId: { type: integer }
                  text: { type: string }
                  userId: { type: integer }
                  day: { type: string, examples: ["2026-08-27"] }
                  order: { type: integer }
                  meta: { type: object }

  /api/v3/user/{userId}/targets:
