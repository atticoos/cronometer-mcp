          application/json:
            schema:
              type: object
              required: [id, auth]
              properties:
                id: { type: integer }
                auth: { $ref: "#/components/schemas/AuthBlock" }
                lastSeen: { type: integer }
                config: { $ref: "#/components/schemas/CallConfig" }
      responses:
        "200":
          description: Food document
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /api/v2/get_foods:
    post:
      tags: [foods]
      operationId: getFoods
      summary: Batch food documents by IDs
      x-confidence: verified
      x-observed-at: 2026-08-26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, auth]
              properties:
                ids: { type: array, items: { type: integer } }
                auth: { $ref: "#/components/schemas/AuthBlock" }
                lastSeen: { type: integer }
                config: { $ref: "#/components/schemas/CallConfig" }
      responses:
        "200":
          description: Food documents
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /api/v2/get_myfoods:
    post:
      tags: [foods]
      operationId: getMyFoods
      summary: User's custom foods and recipes
      x-confidence: verified
      x-observed-at: 2026-08-26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthOnlyBody"
      responses:
        "200":
          description: Custom foods
