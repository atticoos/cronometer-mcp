  /api/v2/check_messages:
    post:
      tags: [misc]
      operationId: checkMessages
      summary: Poll in-app messages/coach threads (app polls this frequently)
      x-confidence: verified
      x-observed-at: 2026-08-26
      x-notes: >-
        Also acts as the settings-change push channel: when targets/prefs are
        edited from another client (e.g. web), this poll surfaces messages
        whose numeric IDs look timestamp-based; the app then POSTs claim_message
        for each ID and refetches get_profile. Message payloads carry no target
        data themselves — the refetch is authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthOnlyBody" }
      responses:
        "200":
          description: Messages
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /api/v2/claim_message:
